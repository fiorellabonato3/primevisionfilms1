<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Prime Vision Films</title>
    <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body class="sin-fondo">

    <header>
        <div>
            <a href="../index.html">
                <img id="logo" src="../Imagenes/pvfilms.png" width="80" height="80" alt="PV Films">
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="menu.html">Películas</a></li>
                <li><a href="categorias.html">Categorías</a></li>
                <li><a href="opiniones.html">Opiniones</a></li>
            </ul>
        </nav>

        <div id="botones" class="botones">
            <a href="registro.html">
                <button>Registrarse</button>
            </a>
            <a href="iniciosesion.html">
                <button>Iniciar Sesión</button>
            </a>
        </div>
    </header>

    <div class="contenedor">
        <div class="caja">

            <h2 class="titulo-opinion">
                Iniciar sesión
            </h2>

            <input
                type="email"
                id="emailLogin"
                placeholder="Correo electrónico"
                class="input-opinion"
            >

            <input
                type="password"
                id="passwordLogin"
                placeholder="Contraseña"
                class="input-opinion"
            >

            <button
                onclick="iniciarSesion()"
                class="btn-publicar"
            >
                Iniciar sesión
            </button>
        </div>
    </div>

    <script src="../js/script.js"></script>

</body>
</html>
